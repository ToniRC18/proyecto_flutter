<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bruma. — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; min-height: 100vh; font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes drawCheck { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .canvas {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: center;
    gap: 56px 32px;
    padding: 48px 32px;
  }
  .label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #555; text-align: center;
    margin-bottom: 14px;
  }
  .frame {
    width: 390px; height: 844px;
    border-radius: 44px; overflow: hidden;
    position: relative;
    border: 1.5px solid #2A2A2A;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .inner { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .statusbar {
    height: 50px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px 0;
    position: relative; z-index: 10;
  }
  .notch {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 34px;
    background: #000; border-radius: 20px;
  }
  .screen {
    flex: 1; display: flex; flex-direction: column;
    padding: 0 24px;
    overflow-y: auto;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Tokens (light, cobalt) ────────────────────────────────────────────────
const b = {
  primary: '#0066FF',
  bg: '#F2F5F8',
  surface: '#FFFFFF',
  surfaceAlt: '#F7F9FB',
  textPrimary: '#0A0F14',
  textSecondary: '#5A6474',
  textTertiary: '#9CA3AF',
  border: '#E8ECF0',
  success: '#00C896',
};

// ── StatusBar ─────────────────────────────────────────────────────────────
function StatusBar() {
  return (
    <div className="statusbar" style={{ background: b.bg }}>
      <div className="notch" />
      <span style={{ fontSize: 14, fontWeight: 600, color: b.textPrimary, zIndex: 1 }}>9:41</span>
      <div style={{ display: 'flex', gap: 6, alignItems: 'center', zIndex: 1, fontSize: 13, color: b.textPrimary }}>
        <span>●●●</span><span>WiFi</span><span>🔋</span>
      </div>
    </div>
  );
}

// ── ProgressDots ──────────────────────────────────────────────────────────
function ProgressDots({ active, total = 4 }) {
  return (
    <div style={{ display: 'flex', gap: 6, justifyContent: 'center', alignItems: 'center' }}>
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} style={{
          width: i === active ? 24 : 6,
          height: 6,
          borderRadius: 3,
          background: i === active ? b.primary : b.border,
          transition: 'all 300ms ease',
        }} />
      ))}
    </div>
  );
}

// ── PrimaryButton / GhostButton ───────────────────────────────────────────
function PrimaryButton({ label, onClick, disabled = false }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button
      onClick={!disabled ? onClick : undefined}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      style={{
        height: 52, width: '100%', borderRadius: 14, border: 'none',
        background: b.primary, color: '#FFFFFF',
        fontFamily: "'DM Sans', sans-serif", fontSize: 16, fontWeight: 600,
        letterSpacing: '-0.01em',
        cursor: disabled ? 'not-allowed' : 'pointer',
        opacity: disabled ? 0.4 : 1,
        transform: pressed ? 'scale(0.97)' : 'scale(1)',
        transition: 'transform 120ms ease, opacity 200ms ease',
      }}
    >{label}</button>
  );
}
function GhostButton({ label, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        height: 44, width: '100%', borderRadius: 14, border: 'none',
        background: 'transparent', color: b.textSecondary,
        fontFamily: "'DM Sans', sans-serif", fontSize: 14, fontWeight: 500,
        cursor: 'pointer',
      }}
    >{label}</button>
  );
}

// ══ PANTALLA 1 — BIENVENIDA ════════════════════════════════════════════════
function Screen1() {
  return (
    <>
      <StatusBar />
      <div className="screen" style={{ background: b.bg, padding: '40px 28px 24px' }}>
        {/* Composición de círculos respirando */}
        <div style={{
          width: 220, height: 220, position: 'relative',
          margin: '40px auto 0',
          animation: 'fadeUp 500ms ease both',
        }}>
          <div style={{
            position: 'absolute', inset: 0,
            borderRadius: '50%',
            background: `${b.primary}14`,
            animation: 'breathe 4s ease-in-out infinite',
          }} />
          <div style={{
            position: 'absolute', inset: 30,
            borderRadius: '50%',
            background: `${b.primary}24`,
            animation: 'breathe 4s ease-in-out infinite',
            animationDelay: '0.4s',
          }} />
          <div style={{
            position: 'absolute',
            top: '50%', left: '50%',
            transform: 'translate(-50%, -50%)',
            width: 96, height: 96,
            borderRadius: '50%',
            background: b.primary,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: `0 12px 40px ${b.primary}40`,
          }}>
            <span style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 40, fontWeight: 800,
              color: '#FFFFFF',
              letterSpacing: '-0.04em',
              lineHeight: 1,
            }}>b<span style={{ color: '#FFFFFF' }}>.</span></span>
          </div>
        </div>

        <div style={{ marginTop: 64, animation: 'fadeUp 500ms 100ms ease both' }}>
          <h1 style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 28, fontWeight: 700,
            color: b.textPrimary,
            letterSpacing: '-0.03em',
            lineHeight: 1.15,
          }}>Bienvenido a<br/>bruma<span style={{ color: b.primary }}>.</span></h1>
        </div>
        <div style={{ marginTop: 12, animation: 'fadeUp 500ms 180ms ease both' }}>
          <p style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 16, fontWeight: 400,
            color: b.textSecondary,
            lineHeight: 1.45,
          }}>Tu dinero, sin ansiedad. Te ayudamos a entenderlo, no a culparte por él.</p>
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ marginBottom: 24, animation: 'fadeUp 500ms 260ms ease both' }}>
          <ProgressDots active={0} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, animation: 'fadeUp 500ms 320ms ease both' }}>
          <PrimaryButton label="Empezar" />
          <GhostButton label="Saltar onboarding" />
        </div>
      </div>
    </>
  );
}

// ══ PANTALLA 2 — CÓMO FUNCIONA ═════════════════════════════════════════════
function FeatureRow({ icon, title, desc, delay }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'flex-start', gap: 14,
      animation: `fadeUp 400ms ${delay}ms ease both`,
    }}>
      <div style={{
        width: 48, height: 48,
        borderRadius: 14,
        background: `${b.primary}1F`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexShrink: 0,
        color: b.primary,
      }}>{icon}</div>
      <div style={{ flex: 1, paddingTop: 2 }}>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 16, fontWeight: 600,
          color: b.textPrimary,
          letterSpacing: '-0.01em',
        }}>{title}</div>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 13, fontWeight: 400,
          color: b.textSecondary,
          lineHeight: 1.45,
          marginTop: 4,
        }}>{desc}</div>
      </div>
    </div>
  );
}

const IconWallet = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M3 8a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/>
    <rect x="3" y="6" width="18" height="14" rx="2"/>
    <circle cx="16" cy="13" r="1.2" fill="currentColor"/>
  </svg>
);
const IconSync = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 12a9 9 0 0 0-9-9 9 9 0 0 0-6.3 2.6"/>
    <polyline points="21 4 21 10 15 10"/>
    <path d="M3 12a9 9 0 0 0 9 9 9 9 0 0 0 6.3-2.6"/>
    <polyline points="3 20 3 14 9 14"/>
  </svg>
);
const IconChart = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="6" y1="20" x2="6" y2="14"/>
    <line x1="12" y1="20" x2="12" y2="9"/>
    <line x1="18" y1="20" x2="18" y2="4"/>
  </svg>
);

function Screen2() {
  return (
    <>
      <StatusBar />
      <div className="screen" style={{ background: b.bg, padding: '32px 24px 24px' }}>
        <div style={{ animation: 'fadeUp 400ms ease both' }}>
          <h1 style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 26, fontWeight: 700,
            color: b.textPrimary,
            letterSpacing: '-0.03em',
            lineHeight: 1.15,
          }}>Tres cosas, ninguna<br/>complicada.</h1>
        </div>
        <p style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 15, fontWeight: 400,
          color: b.textSecondary,
          marginTop: 8,
          animation: 'fadeUp 400ms 80ms ease both',
        }}>Así te ayudamos a tener claridad sobre tu dinero.</p>

        <div style={{ marginTop: 36, display: 'flex', flexDirection: 'column', gap: 20 }}>
          <FeatureRow
            icon={<IconWallet />}
            title="Conecta o registra a mano"
            desc="Empezamos con tu efectivo. Después conectas bancos cuando quieras."
            delay={140}
          />
          <FeatureRow
            icon={<IconSync />}
            title="Cada gasto, una historia"
            desc="Categoriza, anota, comenta. Tu yo del próximo mes te lo va a agradecer."
            delay={220}
          />
          <FeatureRow
            icon={<IconChart />}
            title="Ve hacia dónde va"
            desc="Sin juicios. Solo la verdad de a dónde se fue tu dinero esta semana."
            delay={300}
          />
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ marginBottom: 24, animation: 'fadeUp 400ms 380ms ease both' }}>
          <ProgressDots active={1} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, animation: 'fadeUp 400ms 420ms ease both' }}>
          <PrimaryButton label="Continuar" />
          <GhostButton label="Saltar" />
        </div>
      </div>
    </>
  );
}

// ══ PANTALLA 3 — META MENSUAL ══════════════════════════════════════════════
function Screen3() {
  const [amount, setAmount] = useState(3000);
  const [animating, setAnimating] = useState(false);
  const targetRef = useRef(3000);

  const animateTo = (target) => {
    targetRef.current = target;
    setAnimating(true);
    const start = amount;
    const startTime = performance.now();
    const duration = 400;
    const step = (now) => {
      const t = Math.min((now - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      setAmount(Math.round(start + (target - start) * ease));
      if (t < 1) requestAnimationFrame(step);
      else setAnimating(false);
    };
    requestAnimationFrame(step);
  };

  const Chip = ({ value }) => (
    <button
      onClick={() => animateTo(value)}
      style={{
        height: 36, padding: '0 16px',
        borderRadius: 14,
        background: amount === value ? `${b.primary}14` : b.surface,
        border: `1px solid ${amount === value ? `${b.primary}60` : b.border}`,
        fontFamily: "'DM Sans', sans-serif",
        fontSize: 14, fontWeight: 500,
        color: amount === value ? b.primary : b.textPrimary,
        cursor: 'pointer',
        whiteSpace: 'nowrap',
        transition: 'all 150ms ease',
      }}
    >${value.toLocaleString('es-MX')}</button>
  );

  return (
    <>
      <StatusBar />
      <div className="screen" style={{ background: b.bg, padding: '24px 24px 24px' }}>
        {/* Botón atrás */}
        <div style={{ animation: 'fadeUp 400ms ease both' }}>
          <button style={{
            width: 36, height: 36, borderRadius: 10,
            border: `1px solid ${b.border}`,
            background: b.surface,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer',
            color: b.textPrimary, fontSize: 16,
          }}>←</button>
        </div>

        <div style={{ marginTop: 32, animation: 'fadeUp 400ms 80ms ease both' }}>
          <h1 style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 26, fontWeight: 700,
            color: b.textPrimary,
            letterSpacing: '-0.03em',
            lineHeight: 1.2,
          }}>¿Cuánto te gustaría ahorrar este mes?</h1>
        </div>
        <p style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 15, fontWeight: 400,
          color: b.textSecondary,
          marginTop: 8,
          lineHeight: 1.45,
          animation: 'fadeUp 400ms 160ms ease both',
        }}>Lo puedes cambiar cuando quieras. No es un compromiso, es una brújula.</p>

        {/* Star input */}
        <div style={{
          marginTop: 56,
          textAlign: 'center',
          animation: 'fadeUp 500ms 240ms ease both',
        }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 6 }}>
            <span style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 32, fontWeight: 400,
              color: b.textSecondary,
            }}>$</span>
            <span style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 56, fontWeight: 700,
              color: b.primary,
              letterSpacing: '-0.03em',
              fontVariantNumeric: 'tabular-nums',
              lineHeight: 1,
            }}>{amount.toLocaleString('es-MX')}</span>
            <span style={{
              display: 'inline-block',
              width: 2, height: 48,
              background: b.primary,
              animation: 'pulse 1s ease-in-out infinite',
              marginLeft: 4,
            }} />
          </div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 13, fontWeight: 500,
            color: b.textTertiary,
            marginTop: 8,
          }}>MXN al mes</div>
        </div>

        {/* Chips */}
        <div style={{
          marginTop: 28,
          display: 'flex', gap: 8,
          overflowX: 'auto',
          padding: '0 4px',
          animation: 'fadeUp 400ms 320ms ease both',
        }}>
          {[1000, 3000, 5000, 10000].map(v => <Chip key={v} value={v} />)}
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ marginBottom: 24, animation: 'fadeUp 400ms 400ms ease both' }}>
          <ProgressDots active={2} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, animation: 'fadeUp 400ms 440ms ease both' }}>
          <PrimaryButton label="Guardar meta" disabled={amount === 0} />
          <GhostButton label="Saltar" />
        </div>
      </div>
    </>
  );
}

// ══ PANTALLA 4 — LISTOS ════════════════════════════════════════════════════
function Screen4() {
  return (
    <>
      <StatusBar />
      <div className="screen" style={{ background: b.bg, padding: '40px 24px 24px', alignItems: 'center' }}>
        {/* Checkmark */}
        <div style={{
          width: 96, height: 96, position: 'relative',
          marginTop: 40,
          animation: 'fadeUp 500ms ease both',
        }}>
          <div style={{
            position: 'absolute', inset: 0,
            borderRadius: '50%',
            background: `${b.success}24`,
          }} />
          <div style={{
            position: 'absolute', inset: 16,
            borderRadius: '50%',
            background: b.success,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="5 12 10 17 19 7" style={{
                strokeDasharray: 60,
                strokeDashoffset: 60,
                animation: 'drawCheck 600ms 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards',
              }} />
            </svg>
          </div>
        </div>

        <div style={{ marginTop: 32, textAlign: 'center', animation: 'fadeUp 500ms 200ms ease both' }}>
          <h1 style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 28, fontWeight: 700,
            color: b.textPrimary,
            letterSpacing: '-0.03em',
            lineHeight: 1.15,
          }}>Ya está. Vámonos.</h1>
        </div>
        <p style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 15, fontWeight: 400,
          color: b.textSecondary,
          marginTop: 8,
          lineHeight: 1.45,
          textAlign: 'center',
          maxWidth: 300,
          animation: 'fadeUp 500ms 280ms ease both',
        }}>Creamos tu cuenta de efectivo automáticamente. Empieza por registrar tu primer gasto o ingreso del día.</p>

        {/* Lista de listos */}
        <div style={{
          marginTop: 40,
          display: 'flex', flexDirection: 'column', gap: 12,
          maxWidth: 280, width: '100%',
          animation: 'fadeUp 500ms 360ms ease both',
        }}>
          {[
            'Cuenta de efectivo creada',
            'Categorías base configuradas',
            'Meta del mes registrada',
          ].map(item => (
            <div key={item} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{
                width: 6, height: 6, borderRadius: '50%',
                background: b.success, flexShrink: 0,
              }} />
              <span style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 14, fontWeight: 500,
                color: b.textPrimary,
              }}>{item}</span>
            </div>
          ))}
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ marginBottom: 24, width: '100%', animation: 'fadeUp 500ms 440ms ease both' }}>
          <ProgressDots active={3} />
        </div>
        <div style={{ width: '100%', animation: 'fadeUp 500ms 500ms ease both' }}>
          <PrimaryButton label="Ir a mi dashboard" />
        </div>
      </div>
    </>
  );
}

// ══ APP ═══════════════════════════════════════════════════════════════════
function App() {
  const screens = [
    { label: '1 — Bienvenida', Comp: Screen1 },
    { label: '2 — Cómo funciona', Comp: Screen2 },
    { label: '3 — Tu meta', Comp: Screen3 },
    { label: '4 — Listos', Comp: Screen4 },
  ];

  return (
    <div>
      {/* Header */}
      <div style={{
        padding: '32px 40px 8px',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16,
      }}>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 13, fontWeight: 600,
          color: '#666', letterSpacing: '0.1em',
          textTransform: 'uppercase',
        }}>bruma. — Onboarding</div>
        <div style={{ height: 1, background: '#1E1E1E', width: 80 }} />
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 11, color: '#444',
        }}>4 pantallas · DM Sans · Cobalt</div>
      </div>

      <div className="canvas">
        {screens.map((s, i) => (
          <div key={i} data-screen-label={`0${i + 1} ${s.label.split('— ')[1]}`}>
            <div className="label">{s.label}</div>
            <div className="frame">
              <div className="inner" style={{ background: b.bg }}>
                <s.Comp />
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
