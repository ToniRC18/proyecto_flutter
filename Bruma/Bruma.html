<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bruma — Rediseño Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens-extra.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0D; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'DM Sans', sans-serif; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  /* Scrollbar invisible */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Layout canvas */
  .canvas-wrap {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: center;
    gap: 56px 40px;
    padding: 40px;
    min-height: 100vh;
  }
  .variant-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #555;
    text-align: center;
    margin-bottom: 12px;
  }
  /* Phone frame */
  .phone-frame {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    border: 1.5px solid #2A2A2A;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .phone-inner {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* Status bar */
  .status-bar {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px 0;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .status-bar-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
  }
  /* Screen content */
  .screen-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 90px;
    -webkit-overflow-scrolling: touch;
  }
  /* Bottom nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8px 16px;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 16px;
    border-radius: 12px;
    transition: background 150ms ease;
    position: relative;
  }
  .nav-icon {
    font-size: 22px;
    transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .nav-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    transition: opacity 200ms ease, max-height 200ms ease;
  }
  .nav-dot {
    width: 4px;
    height: 4px;
    border-radius: 2px;
    position: absolute;
    bottom: -2px;
    transition: all 200ms ease;
  }
  /* FAB central */
  .fab-center {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 150ms ease;
    flex-shrink: 0;
  }
  .fab-center:active { transform: scale(0.93); }
  .fab-center:hover { transform: scale(1.05); }
  .fab-icon {
    font-size: 26px;
    color: inherit;
    font-weight: 300;
    line-height: 1;
    margin-top: -2px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Datos de muestra ───────────────────────────────────────────────────────
const SAMPLE_ACCOUNTS = [
  { id: 1, name: 'Efectivo', type: 'efectivo', balance: 3200 },
  { id: 2, name: 'BBVA Débito', type: 'banco', balance: 28450.50 },
  { id: 3, name: 'Nu Crédito', type: 'crédito', balance: -6800 },
  { id: 4, name: 'GBM Inversiones', type: 'inversion', balance: 45000 },
];

const SAMPLE_TRANSACTIONS = [
  { id: 1, title: 'Oxxo Garibaldi', category: 'food', amount: -148.50, date: 'Hoy, 14:22' },
  { id: 2, title: 'Nómina mayo', category: 'income', amount: 24500, date: 'Hoy, 09:00' },
  { id: 3, title: 'Uber', category: 'transport', amount: -87, date: 'Ayer, 21:15' },
  { id: 4, title: 'Amazon', category: 'shopping', amount: -1340, date: 'Ayer, 16:40' },
  { id: 5, title: 'Farmacia Benavides', category: 'health', amount: -230, date: '1 may' },
  { id: 6, title: 'Mercado Soriana', category: 'food', amount: -892, date: '30 abr' },
  { id: 7, title: 'Transferencia Antonio', category: 'transfer', amount: 500, date: '29 abr' },
];

const WEEKLY_DATA = [
  { value: 420 }, { value: 1200 }, { value: 680 }, { value: 950 },
  { value: 320 }, { value: 1800 }, { value: 1070 },
];

const PROFILE_OPTIONS = [
  { icon: '👤', label: 'Información personal' },
  { icon: '🔔', label: 'Notificaciones' },
  { icon: '🔒', label: 'Seguridad y privacidad' },
  { icon: '💳', label: 'Métodos de pago' },
  { icon: '🌙', label: 'Apariencia' },
  { icon: '❓', label: 'Ayuda y soporte' },
];

const totalBalance = SAMPLE_ACCOUNTS.reduce((s, a) => s + a.balance, 0);

// ── StatusBar ──────────────────────────────────────────────────────────────
function StatusBar({ tokens }) {
  const now = new Date();
  const time = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  return (
    <div className="status-bar" style={{ background: tokens.bg }}>
      <div className="status-bar-notch" />
      <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, fontWeight: 600, color: tokens.textPrimary, zIndex: 1 }}>{time}</span>
      <div style={{ display: 'flex', gap: 6, alignItems: 'center', zIndex: 1 }}>
        <span style={{ fontSize: 13, color: tokens.textPrimary }}>●●●</span>
        <span style={{ fontSize: 13, color: tokens.textPrimary }}>WiFi</span>
        <span style={{ fontSize: 13, color: tokens.textPrimary }}>🔋</span>
      </div>
    </div>
  );
}

// ── BottomNav ──────────────────────────────────────────────────────────────
function BottomNav({ activeTab, onTab, tokens, onAdd }) {
  const navItems = [
    { id: 'home', icon: '⌂', label: 'Inicio' },
    { id: 'accounts', icon: '◫', label: 'Cuentas' },
    null, // FAB
    { id: 'stats', icon: '◈', label: 'Stats' },
    { id: 'profile', icon: '◯', label: 'Perfil' },
  ];

  return (
    <div className="bottom-nav" style={{ background: `${tokens.surface}E0`, borderTop: `1px solid ${tokens.border}` }}>
      {navItems.map((item, i) => {
        if (!item) {
          return (
            <div
              key="fab"
              className="fab-center"
              onClick={onAdd}
              style={{
                background: tokens.primary,
                boxShadow: `0 8px 24px ${tokens.primary}50`,
                color: tokens.onPrimary,
              }}
            >
              <span className="fab-icon" style={{ color: tokens.onPrimary }}>+</span>
            </div>
          );
        }
        const isActive = activeTab === item.id;
        return (
          <div
            key={item.id}
            className="nav-item"
            onClick={() => onTab(item.id)}
          >
            <span
              className="nav-icon"
              style={{
                color: isActive ? tokens.primary : tokens.textTertiary,
                transform: isActive ? 'scale(1.15)' : 'scale(1)',
              }}
            >
              {item.icon}
            </span>
            <div
              className="nav-dot"
              style={{
                background: isActive ? tokens.primary : 'transparent',
                width: isActive ? 16 : 4,
              }}
            />
          </div>
        );
      })}
    </div>
  );
}

// ══ PANTALLA: HOME ═══════════════════════════════════════════════════════════
function HomeScreen({ tokens, tweaks }) {
  const [balanceVisible, setBalanceVisible] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setBalanceVisible(true), 200);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ padding: '20px 20px 0' }}>
      {/* Header */}
      <div style={{
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginBottom: 28,
        animation: 'fadeUp 400ms ease both',
      }}>
        <div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 13,
            color: tokens.textSecondary,
            marginBottom: 2,
          }}>Hola,</div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 22,
            fontWeight: 700,
            color: tokens.textPrimary,
            letterSpacing: '-0.03em',
          }}>{tweaks.userName} 👋</div>
        </div>
        <div style={{
          width: 40,
          height: 40,
          borderRadius: 12,
          background: tokens.primarySubtle,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          fontSize: 16,
          cursor: 'pointer',
        }}>🔔</div>
      </div>

      {/* Balance total */}
      <div style={{
        marginBottom: 28,
        animation: 'fadeUp 400ms 100ms ease both',
      }}>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 12,
          fontWeight: 500,
          color: tokens.textSecondary,
          letterSpacing: '0.06em',
          textTransform: 'uppercase',
          marginBottom: 8,
        }}>Balance total</div>
        {balanceVisible && (
          <AnimatedNumber
            value={totalBalance}
            tokens={tokens}
            fontSize={40}
            currency={tweaks.currency}
          />
        )}
        <div style={{
          display: 'flex',
          gap: 8,
          marginTop: 12,
          alignItems: 'center',
        }}>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 12,
            fontWeight: 600,
            color: tokens.success,
            background: `${tokens.success}15`,
            padding: '3px 10px',
            borderRadius: 100,
          }}>↑ 12.4% vs mes anterior</div>
        </div>
      </div>

      {/* Cuentas */}
      <div style={{ marginBottom: 28, animation: 'fadeUp 400ms 200ms ease both' }}>
        <div style={{
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'center',
          marginBottom: 16,
        }}>
          <span style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 17,
            fontWeight: 700,
            color: tokens.textPrimary,
            letterSpacing: '-0.02em',
          }}>Mis cuentas</span>
          <span style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 13,
            fontWeight: 600,
            color: tokens.primary,
            cursor: 'pointer',
          }}>Ver todas</span>
        </div>
        <div style={{
          display: 'flex',
          gap: 12,
          overflowX: 'auto',
          paddingBottom: 4,
        }}>
          {SAMPLE_ACCOUNTS.map(acc => (
            <AccountCard key={acc.id} account={acc} tokens={tokens} compact />
          ))}
        </div>
      </div>

      {/* Gráfica semanal */}
      <div style={{ marginBottom: 28, animation: 'fadeUp 400ms 300ms ease both' }}>
        <AppCard tokens={tokens} padding={20}>
          <div style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'flex-start',
            marginBottom: 20,
          }}>
            <div>
              <div style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 17,
                fontWeight: 700,
                color: tokens.textPrimary,
                letterSpacing: '-0.02em',
              }}>Gastos esta semana</div>
              <div style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                color: tokens.textSecondary,
                marginTop: 2,
              }}>$6,440 en 7 días</div>
            </div>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 11,
              fontWeight: 600,
              color: tokens.error,
              background: `${tokens.error}15`,
              padding: '4px 10px',
              borderRadius: 100,
            }}>↑ 8%</div>
          </div>
          <WeeklyChart data={WEEKLY_DATA} tokens={tokens} />
        </AppCard>
      </div>

      {/* Transacciones recientes */}
      <div style={{ animation: 'fadeUp 400ms 400ms ease both' }}>
        <div style={{
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'center',
          marginBottom: 12,
        }}>
          <span style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 17,

            letterSpacing: '-0.02em',
          }}>Recientes</span>
          <span style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 13,
            fontWeight: 600,

          }}>Ver todas</span>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {SAMPLE_TRANSACTIONS.slice(0, 5).map((tx, i) => (

          ))}

      </div>

}

// ══ PANTALLA: ACCOUNTS ═══════════════════════════════════════════════════════
function AccountsScreen({ tokens, tweaks }) {
  const total = SAMPLE_ACCOUNTS.reduce((s, a) => s + a.balance, 0);
  const [visible, setVisible] = useState(false);
  useEffect(() => { setTimeout(() => setVisible(true), 100); }, []);

  return (
    <div style={{ padding: '20px 20px 0' }}>
      {/* Header centrado */}
      <div style={{
        textAlign: 'center',
        marginBottom: 32,
        animation: 'fadeUp 400ms ease both',
      }}>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 13,
          color: tokens.textSecondary,
          marginBottom: 8,
          letterSpacing: '0.06em',
          textTransform: 'uppercase',
          fontWeight: 500,
        }}>Patrimonio total</div>
        {visible && (
          <AnimatedNumber
            value={total}
            tokens={tokens}
            fontSize={36}
            currency={tweaks.currency}
          />
        )}
      </div>

      {/* Distribución */}
      <AppCard tokens={tokens} padding={16} style={{ marginBottom: 24, animation: 'fadeUp 400ms 100ms ease both' }}>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 13,
          fontWeight: 600,
          color: tokens.textSecondary,
          marginBottom: 12,
        }}>Distribución</div>
        <div style={{ display: 'flex', gap: 4, height: 6, borderRadius: 3, overflow: 'hidden' }}>
          {SAMPLE_ACCOUNTS.filter(a => a.balance > 0).map(acc => {
            const pos = SAMPLE_ACCOUNTS.filter(a => a.balance > 0).reduce((s, a) => s + a.balance, 0);
            const pct = (acc.balance / pos) * 100;
            const typeColors = { efectivo: '#00A878', banco: '#0066FF', inversion: '#9333EA' };
            return (
              <div key={acc.id} style={{
                height: '100%',
                width: `${pct}%`,
                background: typeColors[acc.type] || tokens.primary,
                borderRadius: 3,
              }} />
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 16, marginTop: 12, flexWrap: 'wrap' }}>
          {SAMPLE_ACCOUNTS.filter(a => a.balance > 0).map(acc => {
            const typeColors = { efectivo: '#00A878', banco: '#0066FF', inversion: '#9333EA' };
            const color = typeColors[acc.type] || tokens.primary;
            return (
              <div key={acc.id} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: color }} />
                <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: tokens.textSecondary }}>{acc.name}</span>
              </div>
            );
          })}
        </div>
      </AppCard>

      {/* Lista de cuentas */}
      <div style={{
        fontFamily: "'DM Sans', sans-serif",
        fontSize: 17,
        fontWeight: 700,
        color: tokens.textPrimary,
        letterSpacing: '-0.02em',
        marginBottom: 16,
        animation: 'fadeUp 400ms 150ms ease both',
      }}>Mis cuentas</div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, animation: 'fadeUp 400ms 200ms ease both' }}>
        {SAMPLE_ACCOUNTS.map((acc, i) => (
          <AccountCard key={acc.id} account={acc} tokens={tokens} />
        ))}

        {/* Botón agregar */}
        <div style={{
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          gap: 8,
          padding: '16px',
          cursor: 'pointer',
          borderRadius: 20,
          border: `1px dashed ${tokens.border}`,
          marginTop: 4,
        }}>
          <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, fontWeight: 600, color: tokens.primary }}>
            + Agregar cuenta
          </span>
        </div>
      </div>
    </div>
  );
}

// ══ PANTALLA: ADD TRANSACTION ════════════════════════════════════════════════
function AddTransactionScreen({ tokens, tweaks, onClose }) {
  const [amount, setAmount] = useState('');
  const [title, setTitle] = useState('');
  const [category, setCategory] = useState('food');
  const [type, setType] = useState('gasto');
  const [loading, setLoading] = useState(false);
  const [step, setStep] = useState(1); // 1=monto, 2=detalles
  const [errors, setErrors] = useState({});

  const categories = ['food', 'transport', 'shopping', 'health', 'home', 'other'];

  const handleNext = () => {
    if (!amount || isNaN(parseFloat(amount))) {
      setErrors({ amount: 'Ingresa un monto válido' });
      return;
    }
    setErrors({});
    setStep(2);
  };

  const handleSave = () => {
    if (!title.trim()) {
      setErrors({ title: 'Ingresa un nombre para la transacción' });
      return;
    }
    setErrors({});
    setLoading(true);
    setTimeout(() => { setLoading(false); onClose(); }, 1500);
  };

  return (
    <div style={{
      height: '100%',
      display: 'flex',
      flexDirection: 'column',
      background: tokens.bg,
    }}>
      {/* Header */}
      <div style={{
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '16px 20px 0',
        marginBottom: 24,
      }}>
        <button
          onClick={step === 1 ? onClose : () => setStep(1)}
          style={{
            width: 36, height: 36,
            borderRadius: 10,
            border: `1px solid ${tokens.border}`,
            background: tokens.surface,
            cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 16,
            color: tokens.textPrimary,
          }}
        >←</button>
        <span style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 16,
          fontWeight: 700,
          color: tokens.textPrimary,
          letterSpacing: '-0.02em',
        }}>Nueva transacción</span>
        <div style={{ width: 36 }} />
      </div>

      {/* Paso 1: Monto */}
      {step === 1 && (
        <div style={{ flex: 1, padding: '0 20px', display: 'flex', flexDirection: 'column' }}>
          {/* Tipo gasto/ingreso */}
          <div style={{
            display: 'flex',
            background: tokens.surface,
            border: `1px solid ${tokens.border}`,
            borderRadius: 14,
            padding: 4,
            marginBottom: 32,
          }}>
            {['gasto', 'ingreso'].map(t => (
              <button
                key={t}
                onClick={() => setType(t)}
                style={{
                  flex: 1,
                  height: 40,
                  borderRadius: 10,
                  border: 'none',
                  background: type === t ? tokens.primary : 'transparent',
                  color: type === t ? tokens.onPrimary : tokens.textSecondary,
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 14,
                  fontWeight: 600,
                  cursor: 'pointer',
                  transition: 'all 200ms ease',
                  textTransform: 'capitalize',
                }}
              >{t}</button>
            ))}
          </div>

          {/* Entrada de monto */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              fontWeight: 500,
              color: tokens.textSecondary,
              letterSpacing: '0.06em',
              textTransform: 'uppercase',
              marginBottom: 16,
            }}>¿Cuánto?</div>
            <div style={{
              display: 'flex',
              alignItems: 'baseline',
              gap: 8,
              marginBottom: 8,
            }}>
              <span style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 28,
                fontWeight: 400,
                color: tokens.textSecondary,
              }}>$</span>
              <input
                type="number"
                value={amount}
                onChange={e => { setAmount(e.target.value); setErrors({}); }}
                placeholder="0.00"
                autoFocus
                style={{
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 56,
                  fontWeight: 700,
                  color: amount ? (type === 'gasto' ? tokens.error : tokens.success) : tokens.textTertiary,
                  background: 'transparent',
                  border: 'none',
                  outline: 'none',
                  width: 200,
                  textAlign: 'center',
                  fontVariantNumeric: 'tabular-nums',
                  letterSpacing: '-0.03em',
                }}
              />
            </div>
            {errors.amount && (
              <div style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 13,
                color: tokens.error,
                marginBottom: 8,
              }}>{errors.amount}</div>
            )}
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 13,
              color: tokens.textTertiary,
            }}>MXN</div>
          </div>

          <AppButton
            label="Continuar →"
            tokens={tokens}
            onClick={handleNext}
            expanded
          />
          <div style={{ height: 20 }} />
        </div>
      )}

      {/* Paso 2: Detalles */}
      {step === 2 && (
        <div style={{ flex: 1, padding: '0 20px', display: 'flex', flexDirection: 'column', gap: 20, overflowY: 'auto' }}>
          {/* Resumen de monto */}
          <div style={{
            textAlign: 'center',
            padding: '16px',
            background: tokens.surface,
            border: `1px solid ${tokens.border}`,
            borderRadius: 16,
          }}>
            <span style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 32,
              fontWeight: 700,
              color: type === 'gasto' ? tokens.error : tokens.success,
              fontVariantNumeric: 'tabular-nums',
              letterSpacing: '-0.03em',
            }}>
              {type === 'gasto' ? '-' : '+'}${parseFloat(amount || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}
            </span>
          </div>

          <InputField
            label="Nombre"
            value={title}
            onChange={v => { setTitle(v); setErrors({}); }}
            tokens={tokens}
            error={errors.title}
          />

          {/* Categoría */}
          <div>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              fontWeight: 500,
              color: tokens.textSecondary,
              marginBottom: 10,
            }}>Categoría</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {categories.map(cat => (
                <CategoryPill
                  key={cat}
                  category={cat}
                  selected={category === cat}
                  tokens={tokens}
                  onClick={() => setCategory(cat)}
                />
              ))}
            </div>
          </div>

          {/* Cuenta */}
          <div>
            <div style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 12,
              fontWeight: 500,
              color: tokens.textSecondary,
              marginBottom: 10,
            }}>Cuenta</div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {SAMPLE_ACCOUNTS.map(acc => (
                <button key={acc.id} style={{
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 13,
                  fontWeight: 500,
                  color: tokens.textSecondary,
                  background: tokens.surface,
                  border: `1px solid ${tokens.border}`,
                  borderRadius: 100,
                  padding: '6px 14px',
                  cursor: 'pointer',
                }}>{acc.name}</button>
              ))}
            </div>
          </div>

          <div style={{ flex: 1 }} />
          <AppButton
            label={loading ? undefined : 'Guardar transacción'}
            loading={loading}
            tokens={tokens}
            onClick={handleSave}
            expanded
          />
          <div style={{ height: 8 }} />
        </div>
      )}
    </div>
  );
}

      style={{

        height: 52,
        cursor: 'pointer',

      <span style={{ fontSize: 18, width: 24, textAlign: 'center' }}>{opt.icon}</span>
      <span style={{
        flex: 1,
        fontFamily: "'DM Sans', sans-serif",
        fontSize: 15,
        fontWeight: 400,
        color: tokens.textPrimary,

  );
}

// ══ PHONE WRAPPER ════════════════════════════════════════════════════════════
function PhoneApp({ tokens, tweaks, defaultTab = 'home', label, variant, hideNav = false }) {
  const [activeTab, setActiveTab] = useState(defaultTab);
  const [showAdd, setShowAdd] = useState(false);
  const [prevTab, setPrevTab] = useState(null);

  const handleTab = (tab) => {
    setPrevTab(activeTab);
    setActiveTab(tab);
  };

  const renderScreen = () => {
    if (showAdd) return <AddTransactionScreen tokens={tokens} tweaks={tweaks} onClose={() => setShowAdd(false)} />;
    switch (activeTab) {
      case 'home': return <HomeScreen tokens={tokens} tweaks={tweaks} />;
      case 'accounts': return <AccountsScreen tokens={tokens} tweaks={tweaks} />;
      case 'profile': return <ProfileScreen tokens={tokens} tweaks={tweaks} />;
      case 'login': return <window.LoginScreen tokens={tokens} tweaks={tweaks} />;
      case 'stats': return <window.StatsScreen tokens={tokens} tweaks={tweaks} />;
      case 'spaces': return <window.SpacesScreen tokens={tokens} tweaks={tweaks} />;
      case 'spaceDetail': return <window.SpaceDetailScreen tokens={tokens} tweaks={tweaks} />;
      case 'txDetail': return <window.TransactionDetailScreen tokens={tokens} tweaks={tweaks} />;
      case 'transfer': return <window.TransferScreen tokens={tokens} tweaks={tweaks} />;
      default: return (
        <div style={{
          flex: 1,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          flexDirection: 'column',
          gap: 12,
          padding: 40,
        }}>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 40,
            opacity: 0.2,
          }}>◈</div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 15,
            color: tokens.textTertiary,
            textAlign: 'center',
          }}>Pantalla próximamente</div>
        </div>
      );
    }
  };

  return (
    <div>
      <div className="phone-frame">
        <div className="phone-inner" style={{ background: tokens.bg }}>
          <StatusBar tokens={tokens} />
          <div className="screen-content">
            {renderScreen()}
          </div>
          {!showAdd && !hideNav && (
            <BottomNav
              activeTab={activeTab}
              onTab={handleTab}
              tokens={tokens}
              onAdd={() => setShowAdd(true)}
            />
          )}
        </div>
      </div>
    </div>
  );
}

// ══ APP PRINCIPAL ════════════════════════════════════════════════════════════
function App() {

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "darkMode": false,
    "colorTheme": "cobalt",
    "userName": "Antonio",
    "currency": "MXN",

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const variants = [
    { label: '1 — Home', tab: 'home', hideNav: false },
    { label: '2 — Cuentas', tab: 'accounts', hideNav: false },
    { label: '3 — Perfil', tab: 'profile', hideNav: false },
    { label: '4 — Login / Register', tab: 'login', hideNav: true },
    { label: '5 — Stats / Presupuestos', tab: 'stats', hideNav: false },
    { label: '6 — Grupos compartidos', tab: 'spaces', hideNav: false },
    { label: '7 — Detalle de grupo', tab: 'spaceDetail', hideNav: false },
    { label: '8 — Detalle de transacción', tab: 'txDetail', hideNav: false },
    { label: '9 — Transferencia (overlay)', tab: 'transfer', hideNav: true },
  ];

  return (
    <div style={{ minHeight: '100vh', background: '#0A0A0A' }}>
      {/* Header del canvas */}
      <div style={{
        padding: '28px 40px 0',

          fontWeight: 600,

      <div className="canvas-wrap">
        {variants.map((v, i) => {
          const tokens = makeTokens(tweaks);
          return (
            <div key={i}>
              <div className="variant-label">{v.label}</div>
              <PhoneApp
                tokens={tokens}
                tweaks={tweaks}
                defaultTab={v.tab}

            { value: 'cobalt', label: 'Cobalt' },
          ]}
          onChange={v => setTweak('colorTheme', v)}
        />
        <window.TweakSection title="Contenido" />
        <window.TweakText
          label="Nombre usuario"
          value={tweaks.userName}
          onChange={v => setTweak('userName', v)}
        />
        <window.TweakSelect
          label="Moneda"
          value={tweaks.currency}
          options={[
            { value: 'MXN', label: 'MXN — Peso mexicano' },
            { value: 'USD', label: 'USD — Dólar' },

          label="Bordes"

          options={[
            { value: 'sharp', label: 'Sharp' },
            { value: 'default', label: 'Default' },
            { value: 'pill', label: 'Pill' },
          ]}
          onChange={v => setTweak('roundness', v)}
        />
      </TweaksPanel>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
